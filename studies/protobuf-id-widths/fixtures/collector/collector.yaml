receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:45569
exporters:
  file/traces:
    path: traces.jsonl
  file/logs:
    path: logs.jsonl
service:
  telemetry:
    logs:
      level: error
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces]
    logs:
      receivers: [otlp]
      exporters: [file/logs]
